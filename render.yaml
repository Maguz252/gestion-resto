services:
  - type: web
    name: restogest
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "RestoGest"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr